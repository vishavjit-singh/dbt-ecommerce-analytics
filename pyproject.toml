[project]
name = "dbt-ecommerce-analytics"
version = "1.0.0"
description = "dbt + DuckDB analytics engineering project for a synthetic e-commerce shop: tested staging, intermediate and mart models, an incremental fact, an SCD2 snapshot and docs."
authors = [{ name = "Vishavjit Singh Saini" }]
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["pytests"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "pytests"]

[tool.ruff.lint]
select = ["E", "F", "W"]
